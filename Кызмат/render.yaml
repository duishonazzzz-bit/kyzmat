services:
  - type: web
    name: kyzmat-marketplace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: WEB_DIST_DIR
        value: apps/web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: kyzmat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOW_MEMORY_FALLBACK
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: VPN_ONLY
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@kyzmat.local

databases:
  - name: kyzmat-db
    databaseName: kyzmat
    user: kyzmat
    plan: free
    region: frankfurt
